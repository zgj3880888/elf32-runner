plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.elf32runner'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.elf32runner"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // 零第三方依赖：体积最小化。只用 AndroidX 基础（可选，这里连它都不用，
    // 直接用平台 API，避免引入 androidx 额外几百 KB）
}
